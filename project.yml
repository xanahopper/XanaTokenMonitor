name: XanaTokenMonitor
options:
  bundleIdPrefix: com.xana
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
    watchOS: "10.0"
  xcodeVersion: "16.0"
  groupSortPosition: top

packages:
  XanaTokenMonitorKit:
    path: .

targets:
  XanaTokenMonitoriOS:
    type: application
    platform: iOS
    sources:
      - path: iOS
      - path: Sources/XanaTokenMonitorKit
        group: XanaTokenMonitorKit
    dependencies:
      - package: XanaTokenMonitorKit
    settings:
      INFOPLIST_FILE: iOS/Info.plist
      PRODUCT_BUNDLE_IDENTIFIER: com.xana.XanaTokenMonitoriOS
      MARKETING_VERSION: "1.0.0"
      CURRENT_PROJECT_VERSION: "1"

  XanaTokenMonitorMacOS:
    type: application
    platform: macOS
    sources:
      - path: macOS
      - path: Sources/XanaTokenMonitorKit
        group: XanaTokenMonitorKit
    dependencies:
      - package: XanaTokenMonitorKit
      - target: TokenMonitorWidgetMacOS
    settings:
      INFOPLIST_FILE: macOS/Info.plist
      PRODUCT_BUNDLE_IDENTIFIER: com.xana.XanaTokenMonitorMacOS
      MARKETING_VERSION: "1.0.0"
      CURRENT_PROJECT_VERSION: "1"
      CODE_SIGN_ENTITLEMENTS: macOS/XanaTokenMonitorMacOS.entitlements

      CODE_SIGN_IDENTITY: "-"
      DEVELOPMENT_TEAM: ""
      CODE_SIGNING_REQUIRED: "NO"
      PROVISIONING_PROFILE_SPECIFIER: ""

  XanaTokenMonitorWatchOS:
    type: application
    platform: watchOS
    sources:
      - path: watchOS
      - path: Sources/XanaTokenMonitorKit
        group: XanaTokenMonitorKit
    settings:
      INFOPLIST_FILE: watchOS/Info.plist
      PRODUCT_BUNDLE_IDENTIFIER: com.xana.XanaTokenMonitorWatchOS
      MARKETING_VERSION: "1.0.0"
      CURRENT_PROJECT_VERSION: "1"

  TokenMonitorWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: WidgetExtension
    dependencies:
      - package: XanaTokenMonitorKit
    settings:
      INFOPLIST_FILE: WidgetExtension/Info.plist
      PRODUCT_BUNDLE_IDENTIFIER: com.xana.XanaTokenMonitoriOS.Widget
      MARKETING_VERSION: "1.0.0"
      CURRENT_PROJECT_VERSION: "1"

  TokenMonitorWidgetMacOS:
    type: app-extension
    platform: macOS
    sources:
      - path: WidgetExtension
    dependencies:
      - package: XanaTokenMonitorKit
    settings:
      INFOPLIST_FILE: WidgetExtension/Info.plist
      PRODUCT_BUNDLE_IDENTIFIER: com.xana.XanaTokenMonitorMacOS.Widget
      MARKETING_VERSION: "1.0.0"
      CURRENT_PROJECT_VERSION: "1"
      CODE_SIGN_ENTITLEMENTS: WidgetExtension/TokenMonitorWidgetMacOS.entitlements